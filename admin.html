<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signage Control · Content Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161a;
    --panel:#1b1e24;
    --panel-2:#20232b;
    --line:#2b2f38;
    --ink:#eceef1;
    --ink-dim:#9aa1ad;
    --amber:#f2b90c;
    --teal:#12a7ac;
    --danger:#e0554f;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    min-height:100vh;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  header .brand{ display:flex; align-items:center; gap:12px; }
  header .brand .mark{
    width:34px; height:34px; border-radius:8px;
    background:linear-gradient(135deg,var(--amber),#c98f00);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:#14161a; font-size:16px;
  }
  header h1{
    font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; margin:0; letter-spacing:-0.01em;
  }
  header .sub{ color:var(--ink-dim); font-size:12.5px; font-family:'JetBrains Mono',monospace; }

  .layout{
    display:grid; grid-template-columns:220px 1fr 360px; gap:0;
    min-height:calc(100vh - 71px);
  }
  .screens{
    border-right:1px solid var(--line); padding:18px 14px; background:var(--panel);
  }
  .screens .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-dim); margin:6px 8px 10px; }
  .screen-btn{
    width:100%; text-align:left; padding:10px 12px; border-radius:8px; border:1px solid transparent;
    background:transparent; color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:13px;
    cursor:pointer; margin-bottom:4px; display:flex; align-items:center; justify-content:space-between;
  }
  .screen-btn:hover{ background:var(--panel-2); }
  .screen-btn.active{ background:rgba(242,185,12,0.1); border-color:rgba(242,185,12,0.4); color:var(--amber); }
  .add-screen{
    width:100%; padding:10px; border-radius:8px; border:1px dashed var(--line);
    background:transparent; color:var(--ink-dim); font-size:13px; cursor:pointer; margin-top:8px;
  }
  .add-screen:hover{ color:var(--ink); border-color:var(--ink-dim); }

  .editor{ padding:24px 28px; overflow-y:auto; }
  .editor h2{ font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0 0 4px; }
  .editor .hint{ color:var(--ink-dim); font-size:13px; margin-bottom:20px; }

  .slide-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px;
  }
  .slide-card .row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .slide-card .badge{
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:3px 8px; border-radius:20px;
    background:var(--panel-2); color:var(--ink-dim); text-transform:uppercase;
  }
  .slide-card .badge.image{ color:#7fd1d6; }
  .slide-card .badge.video{ color:#f2b90c; }
  .slide-card .badge.text{ color:#c9a6ff; }
  .slide-card .grow{ flex:1; }
  .slide-card input[type=text], .slide-card input[type=number], .slide-card input[type=color], .slide-card select{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    color:var(--ink); padding:8px 10px; font-size:13px; font-family:'Inter',sans-serif;
  }
  .field-label{ font-size:11px; color:var(--ink-dim); margin-bottom:4px; display:block; }
  .field{ margin-bottom:10px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--ink-dim); }
  .icon-btn.danger:hover{ color:var(--danger); border-color:var(--danger); }

  .add-row{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .add-row button{
    flex:1; min-width:120px; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:13px; cursor:pointer;
  }
  .add-row button:hover{ border-color:var(--teal); color:var(--teal); }

  .export{
    margin-top:24px; padding-top:20px; border-top:1px solid var(--line);
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .btn-primary{
    background:var(--amber); color:#14161a; border:none; font-weight:600;
    padding:11px 18px; border-radius:8px; cursor:pointer; font-size:13.5px;
  }
  .btn-primary:hover{ background:#ffd23f; }
  .btn-ghost{
    background:transparent; border:1px solid var(--line); color:var(--ink);
    padding:11px 16px; border-radius:8px; cursor:pointer; font-size:13.5px;
  }
  .btn-ghost:hover{ border-color:var(--ink-dim); }
  #file-input{ display:none; }
  .export .filename{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); }

  /* Preview column */
  .preview-col{
    border-left:1px solid var(--line); background:var(--panel); padding:24px 22px;
    display:flex; flex-direction:column; align-items:center;
  }
  .preview-col h2{ font-family:'Space Grotesk',sans-serif; font-size:14px; align-self:flex-start; margin:0 0 4px; }
  .preview-col .hint{ color:var(--ink-dim); font-size:12.5px; align-self:flex-start; margin-bottom:18px; }

  .tv{
    width:100%; aspect-ratio:16/9; background:#000; border-radius:6px;
    border:10px solid #0a0b0d; box-shadow:0 0 0 1px #2b2f38, 0 20px 40px rgba(0,0,0,0.4);
    position:relative; overflow:hidden;
  }
  .tv-stand{ width:64px; height:14px; background:#0a0b0d; margin-top:0; border-radius:0 0 4px 4px; }
  .tv-stand-base{ width:120px; height:6px; background:#0a0b0d; border-radius:3px; margin-top:2px; }

  .p-slide{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity 600ms ease;
  }
  .p-slide.active{ opacity:1; }
  .p-slide img, .p-slide video{ width:100%; height:100%; object-fit:cover; }
  .p-slide.text{ flex-direction:column; text-align:center; padding:8%; }
  .p-slide.text .h{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:9%; line-height:1.05; }
  .p-slide.text .s{ font-size:4.5%; margin-top:3%; opacity:0.85; }

  .p-empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#4a4f59; font-family:'JetBrains Mono',monospace; font-size:13px; text-align:center; padding:20px;
  }
  .p-dots{ display:flex; gap:6px; margin-top:16px; }
  .p-dots span{ width:6px; height:6px; border-radius:50%; background:var(--line); }
  .p-dots span.on{ background:var(--amber); }

  .p-meta{ margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-dim); text-align:center; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">S</div>
    <div>
      <h1>Signage Control</h1>
      <div class="sub">content editor · exports per-screen JSON</div>
    </div>
  </div>
  <div class="sub" id="screen-count-label"></div>
</header>

<div class="layout">
  <div class="screens">
    <div class="label">Screens</div>
    <div id="screen-list"></div>
    <button class="add-screen" id="add-screen-btn">+ Add screen</button>
  </div>

  <div class="editor">
    <h2 id="editor-title">Screen 1</h2>
    <div class="hint">Build the loop for this display. Slides play in order, then repeat.</div>

    <div id="slide-list"></div>

    <div class="add-row">
      <button data-add="image">+ Image slide</button>
      <button data-add="video">+ Video slide</button>
      <button data-add="text">+ Text slide</button>
    </div>

    <div class="export">
      <button class="btn-primary" id="download-btn">Download screen-<span id="dl-id">1</span>.json</button>
      <button class="btn-ghost" id="load-btn">Load existing JSON…</button>
      <input type="file" id="file-input" accept="application/json">
      <span class="filename" id="version-label"></span>
    </div>
  </div>

  <div class="preview-col">
    <h2>Live preview</h2>
    <div class="hint">Approximates what plays on the display</div>
    <div class="tv"><div id="tv-stage"></div></div>
    <div class="tv-stand"></div>
    <div class="tv-stand-base"></div>
    <div class="p-dots" id="p-dots"></div>
    <div class="p-meta" id="p-meta">no slides yet</div>
  </div>
</div>

<script>
/* ---------------------------------------------------------
   In-memory content model. Nothing is persisted automatically —
   use "Download" to export a screen-N.json file, then upload
   that file to your content/ folder (e.g. via GitHub's web
   uploader) to push it live. Use "Load existing JSON" to
   reopen a file you exported earlier and keep editing it.
--------------------------------------------------------- */
let screens = { '1': { name: 'Screen 1', items: [] }, '2': { name: 'Screen 2', items: [] } };
let activeScreen = '1';
let previewIndex = 0;
let previewTimer = null;

function uid(){ return Math.random().toString(36).slice(2, 9); }

function renderScreenList(){
  const list = document.getElementById('screen-list');
  list.innerHTML = '';
  Object.keys(screens).forEach(id => {
    const btn = document.createElement('button');
    btn.className = 'screen-btn' + (id === activeScreen ? ' active' : '');
    btn.innerHTML = `<span>${screens[id].name}</span><span style="opacity:.5">${screens[id].items.length}</span>`;
    btn.onclick = () => { activeScreen = id; renderAll(); };
    list.appendChild(btn);
  });
  document.getElementById('screen-count-label').textContent = Object.keys(screens).length + ' screen(s) configured';
}

function renderEditor(){
  const s = screens[activeScreen];
  document.getElementById('editor-title').textContent = s.name;
  document.getElementById('dl-id').textContent = activeScreen;
  const list = document.getElementById('slide-list');
  list.innerHTML = '';

  if (!s.items.length) {
    const empty = document.createElement('div');
    empty.className = 'hint';
    empty.style.padding = '30px 0';
    empty.textContent = 'No slides yet — add an image, video, or text slide below.';
    list.appendChild(empty);
  }

  s.items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'slide-card';

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="badge ${item.type}">${item.type}</span>
      <span class="grow"></span>
    `;
    const up = mkIconBtn('↑', () => moveSlide(i, -1));
    const down = mkIconBtn('↓', () => moveSlide(i, 1));
    const del = mkIconBtn('✕', () => removeSlide(i), true);
    row.appendChild(up); row.appendChild(down); row.appendChild(del);
    card.appendChild(row);

    if (item.type === 'image' || item.type === 'video') {
      card.appendChild(field('Source URL', input('text', item.src || '', v => { item.src = v; refreshPreviewMaybe(); })));
      const twoCol = document.createElement('div');
      twoCol.className = 'two-col';
      twoCol.appendChild(field('Duration (seconds)', input('number', item.duration ?? (item.type === 'video' ? 30 : 8), v => item.duration = Number(v))));
      if (item.type === 'video') {
        twoCol.appendChild(field('Audio', selectBox(['Muted', 'Sound on'], item.muted === false ? 1 : 0, v => item.muted = (v === 0))));
      }
      card.appendChild(twoCol);
    } else if (item.type === 'text') {
      card.appendChild(field('Headline', input('text', item.headline || '', v => { item.headline = v; refreshPreviewMaybe(); })));
      card.appendChild(field('Subline (optional)', input('text', item.subline || '', v => item.subline = v)));
      const twoCol = document.createElement('div');
      twoCol.className = 'two-col';
      twoCol.appendChild(field('Background', input('color', item.bg || '#111111', v => { item.bg = v; refreshPreviewMaybe(); })));
      twoCol.appendChild(field('Text color', input('color', item.fg || '#ffffff', v => { item.fg = v; refreshPreviewMaybe(); })));
      card.appendChild(twoCol);
      card.appendChild(field('Duration (seconds)', input('number', item.duration ?? 7, v => item.duration = Number(v))));
    }

    list.appendChild(card);
  });

  renderScreenList();
}

function mkIconBtn(label, onclick, danger){
  const b = document.createElement('button');
  b.className = 'icon-btn' + (danger ? ' danger' : '');
  b.textContent = label;
  b.onclick = onclick;
  return b;
}
function field(label, inputEl){
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const l = document.createElement('span');
  l.className = 'field-label';
  l.textContent = label;
  wrap.appendChild(l);
  wrap.appendChild(inputEl);
  return wrap;
}
function input(type, value, onChange){
  const el = document.createElement('input');
  el.type = type;
  el.value = value;
  el.oninput = () => onChange(type === 'number' ? Number(el.value) : el.value);
  return el;
}
function selectBox(options, selectedIndex, onChange){
  const el = document.createElement('select');
  options.forEach((opt, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = opt;
    if (i === selectedIndex) o.selected = true;
    el.appendChild(o);
  });
  el.onchange = () => onChange(Number(el.value));
  return el;
}

function moveSlide(i, dir){
  const items = screens[activeScreen].items;
  const j = i + dir;
  if (j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  renderEditor();
}
function removeSlide(i){
  screens[activeScreen].items.splice(i, 1);
  renderEditor();
  refreshPreviewMaybe(true);
}

document.querySelectorAll('[data-add]').forEach(btn => {
  btn.onclick = () => {
    const type = btn.getAttribute('data-add');
    const base = { type };
    if (type === 'image') Object.assign(base, { src: '', duration: 8 });
    if (type === 'video') Object.assign(base, { src: '', duration: 30, muted: true });
    if (type === 'text') Object.assign(base, { headline: '', subline: '', bg: '#111111', fg: '#ffffff', duration: 7 });
    screens[activeScreen].items.push(base);
    renderEditor();
  };
});

document.getElementById('add-screen-btn').onclick = () => {
  const n = Object.keys(screens).length + 1;
  const id = String(n);
  if (screens[id]) { let k = n; while (screens[String(k)]) k++; screens[String(k)] = { name: 'Screen ' + k, items: [] }; activeScreen = String(k); }
  else { screens[id] = { name: 'Screen ' + id, items: [] }; activeScreen = id; }
  renderAll();
};

document.getElementById('download-btn').onclick = () => {
  const s = screens[activeScreen];
  const payload = {
    version: new Date().toISOString().replace(/[:.]/g, '-'),
    screen_name: s.name,
    items: s.items
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `screen-${activeScreen}.json`;
  a.click();
  document.getElementById('version-label').textContent = 'exported ' + payload.version;
};

document.getElementById('load-btn').onclick = () => document.getElementById('file-input').click();
document.getElementById('file-input').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      screens[activeScreen] = { name: data.screen_name || screens[activeScreen].name, items: data.items || [] };
      renderAll();
    } catch (err) {
      alert('Could not read that file — is it a valid signage JSON export?');
    }
  };
  reader.readAsText(file);
};

/* --- Live preview --- */
function refreshPreviewMaybe(force){
  // cheap debounce: just re-render on next tick
  clearTimeout(window.__pvTimeout);
  window.__pvTimeout = setTimeout(() => startPreview(), force ? 0 : 400);
}

function startPreview(){
  clearTimeout(previewTimer);
  previewIndex = 0;
  showPreviewSlide();
}

function showPreviewSlide(){
  const items = screens[activeScreen].items;
  const stage = document.getElementById('tv-stage');
  const dots = document.getElementById('p-dots');
  const meta = document.getElementById('p-meta');
  stage.innerHTML = '';
  dots.innerHTML = '';

  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'p-empty';
    empty.textContent = 'Add a slide to see it here';
    stage.appendChild(empty);
    meta.textContent = 'no slides yet';
    return;
  }

  items.forEach((_, i) => {
    const d = document.createElement('span');
    if (i === previewIndex) d.className = 'on';
    dots.appendChild(d);
  });

  const item = items[previewIndex];
  const el = document.createElement('div');
  el.className = 'p-slide';
  if (item.type === 'image') {
    const img = document.createElement('img');
    img.src = item.src || '';
    el.appendChild(img);
  } else if (item.type === 'video') {
    const vid = document.createElement('video');
    vid.src = item.src || '';
    vid.muted = true; vid.autoplay = true; vid.loop = true;
    el.appendChild(vid);
  } else if (item.type === 'text') {
    el.classList.add('text');
    el.style.background = item.bg || '#111';
    el.style.color = item.fg || '#fff';
    const h = document.createElement('div'); h.className = 'h'; h.textContent = item.headline || '(headline)';
    el.appendChild(h);
    if (item.subline) { const s = document.createElement('div'); s.className = 's'; s.textContent = item.subline; el.appendChild(s); }
  }
  stage.appendChild(el);
  requestAnimationFrame(() => el.classList.add('active'));

  meta.textContent = `slide ${previewIndex + 1} of ${items.length} · ${item.type} · ${item.duration || (item.type==='video'?30:8)}s`;

  const ms = Math.min((item.duration || 8) * 1000, 6000); // cap preview cycling so editing stays snappy
  previewTimer = setTimeout(() => {
    previewIndex = (previewIndex + 1) % items.length;
    showPreviewSlide();
  }, ms);
}

function renderAll(){
  renderEditor();
  startPreview();
}
renderAll();
</script>
</body>
</html>
